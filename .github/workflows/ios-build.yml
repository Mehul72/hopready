name: iOS simulator build and UI tests

# Compiles the native iOS project without signing, then runs the XCUITest journeys against a
# Release simulator build (docs/testing.md). Manual because macOS runners are slow; release builds
# go through EAS (see docs/release.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Prebuild and compile for the simulator
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project with the UI test target
        working-directory: apps/mobile
        env:
          HOPREADY_IOS_UI_TESTS: '1'
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Pick a simulator
        id: simulator
        run: |
          name="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+ Pro' || true)"
          if [ -z "$name" ]; then echo "No iPhone Pro simulator on this runner" >&2; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Build the Release app and UI tests for the simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild build-for-testing -workspace HopReady.xcworkspace -scheme HopReady \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath build
      - name: Run the UI tests
        working-directory: apps/mobile/ios
        run: |
          xcodebuild test-without-building \
            -xctestrun "$(ls build/Build/Products/*.xctestrun | head -1)" \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -collect-test-diagnostics never -only-testing:HopReadyUITests \
            -resultBundlePath build/ui-tests.xcresult
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: apps/mobile/ios/build/ui-tests.xcresult
          retention-days: 7
