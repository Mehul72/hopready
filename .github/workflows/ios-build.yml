name: iOS simulator build

# Compiles the native iOS project without signing, to catch native breakage. Manual because macOS
# runners are slow; release builds go through EAS (see docs/release.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Prebuild and compile for the simulator
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile for the iOS simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace HopReady.xcworkspace -scheme HopReady -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
