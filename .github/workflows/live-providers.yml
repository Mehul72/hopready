name: Live provider checks

# Calls the real TfNSW and Apple Maps APIs with repository secrets. Manual only, so a missing key
# or a provider outage never shows up as a failing scheduled run. Add a schedule once secrets exist.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live TfNSW and Apple Maps calls
    if: github.repository == 'Mehul72/hopready'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: live-provider-checks
    env:
      TZ: UTC
      TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
      APPLE_MAPS_TEAM_ID: ${{ secrets.APPLE_MAPS_TEAM_ID }}
      APPLE_MAPS_KEY_ID: ${{ secrets.APPLE_MAPS_KEY_ID }}
      APPLE_MAPS_PRIVATE_KEY: ${{ secrets.APPLE_MAPS_PRIVATE_KEY }}
    steps:
      # Live tests skip themselves without keys; fail here instead so a skipped run never looks green.
      - name: Require provider secrets
        run: |
          missing=0
          for name in TFNSW_API_KEY APPLE_MAPS_TEAM_ID APPLE_MAPS_KEY_ID APPLE_MAPS_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run live provider tests
        run: pnpm --filter @hopready/api exec vitest run live
