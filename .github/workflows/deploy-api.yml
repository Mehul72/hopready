name: Deploy API

# Manual deploys only. The production environment should require a reviewer in repository settings.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  checks:
    name: Checks on the commit being deployed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the Worker and its secrets
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.152.0'
          workingDirectory: apps/api
          # Production is wrangler's top-level config; staging is its named environment.
          command: deploy${{ inputs.environment == 'staging' && ' --env staging' || '' }}
          secrets: |
            TFNSW_API_KEY
            APPLE_MAPS_TEAM_ID
            APPLE_MAPS_KEY_ID
            APPLE_MAPS_PRIVATE_KEY
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
          APPLE_MAPS_TEAM_ID: ${{ secrets.APPLE_MAPS_TEAM_ID }}
          APPLE_MAPS_KEY_ID: ${{ secrets.APPLE_MAPS_KEY_ID }}
          APPLE_MAPS_PRIVATE_KEY: ${{ secrets.APPLE_MAPS_PRIVATE_KEY }}
      # A deploy only counts once the live service answers; API_BASE_URL is an environment variable.
      - name: Check the deployed health endpoint
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then echo "::error::Set the API_BASE_URL variable for this environment"; exit 1; fi
          curl --fail --silent --show-error --max-time 15 "$API_BASE_URL/v1/health"
